# Spring Application
spring.application.name=finance-tracker

# Server Configuration
server.port=8080
server.servlet.context-path=/finance-tracker/api/v1

# Jackson Serialization
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false


# Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/finance_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Singapore
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:pssword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10:
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Configurations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Singapore
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Session Management
spring.session.store-type=redis
spring.session.redis.namespace=finance:session
spring.session.timeout=24h

# SECURITY (MVP - disable csrf complexity)
spring.security.user.name=admin
spring.security.user.password=admin

# FILE UPLOAD
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Feign Client
spring.cloud.openfeign.okhttp.enabled=true

# OLLAMA
# Port where your local Ollama service is listening
spring.ai.ollama.base-url=http://localhost:11434
# Ensure you have run 'ollama pull llama3.2' in your computer terminal first
spring.ai.ollama.chat.options.model=llama3.2
# Optional: Adjust the creativity temperature (0.0 = precise, 1.0 = highly creative)
spring.ai.ollama.chat.options.temperature=0.7

# Custom Application Properties
app.exchange-rate.base-currency=SGD
app.exchange-rate.frankfurter-url=https://api.frankfurter.app
app.exchange-rate.cron=0 0 0 * * *

# Logging
logging.level.com.finance=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
